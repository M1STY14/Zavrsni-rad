# Reference nginx server block for mtv.leokocijan.dev.
#
# 1. Put the limit_req_zone line inside the http {} block of
#    /etc/nginx/nginx.conf (it cannot live in a server block). Skip it if
#    you already define a zone for the portfolio — zones can be shared.
# 2. Copy this server block to /etc/nginx/sites-available/mtv.leokocijan.dev,
#    symlink into sites-enabled, then run certbot to add the TLS lines:
#       sudo ln -s /etc/nginx/sites-available/mtv.leokocijan.dev /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d mtv.leokocijan.dev
#
# --- goes in http {} in /etc/nginx/nginx.conf ---
# limit_req_zone $binary_remote_addr zone=mtv_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mtv.leokocijan.dev;

    # /api/* is the only path that does real work — rate limit it per IP.
    location /api/ {
        limit_req zone=mtv_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the SPA + static assets, served by the Node process.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
